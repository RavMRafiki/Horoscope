<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="50%" stop-color="#e5c170"/>
      <stop offset="100%" stop-color="#ad802c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101423"/>
      <stop offset="100%" stop-color="#070910"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="62" font-family="Georgia, serif" font-size="12" fill="#fde9a6" text-anchor="middle">✦ HOROSKOP PODRÓŻY ✦</text>
  <text x="600" y="110" font-family="Georgia, serif" font-size="44" font-weight="700" fill="url(#gold)" text-anchor="middle">AstroCommute</text>
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Karty energii środków transportu — od najlepszej do najgorszej.</text>
  <rect x="490" y="156" width="220" height="34" rx="17" fill="#1b2236" stroke="#e6c374" stroke-opacity="0.45"/>
  <text x="600" y="178" font-family="Georgia, serif" font-size="12" fill="#fde9a6" text-anchor="middle">Zmień wybór i sprawdź ponownie</text>

  <g transform="translate(120,210)">
    <rect width="280" height="430" rx="16" fill="url(#card)" stroke="#e6c374" stroke-width="2"/>
    <rect x="14" y="14" width="252" height="402" rx="12" fill="#0a0d16" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="24" y="38" font-family="monospace" font-size="10" fill="#e6c374">✦ ARCANA I</text>
    <circle cx="140" cy="36" r="13" fill="#1a1a10" stroke="#e6c374"/><text x="140" y="40" font-family="Georgia,serif" font-size="12" fill="#fde9a6" text-anchor="middle">1</text>
    <rect x="24" y="54" width="232" height="120" rx="10" fill="#141a2a" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="140" y="110" font-family="Georgia,serif" font-size="18" fill="#fef3c7" text-anchor="middle">TRAMWAJ</text>
    <text x="140" y="132" font-family="Georgia,serif" font-size="11" fill="#e6c374" text-anchor="middle" font-style="italic">Szynowy Medium Prądów Losu</text>
    <rect x="24" y="182" width="232" height="26" rx="8" fill="#101624" stroke="#e6c374" stroke-opacity="0.2"/>
    <text x="34" y="199" font-family="Arial" font-size="9" fill="#e6c374">ŻYWIOŁ</text><text x="90" y="199" font-family="Arial" font-size="10" fill="#e2e8f0">Iskry z Pantografu</text>
    <rect x="24" y="214" width="232" height="26" rx="8" fill="#101624" stroke="#e6c374" stroke-opacity="0.2"/>
    <text x="34" y="231" font-family="Arial" font-size="9" fill="#e6c374">PATRON</text><text x="90" y="231" font-family="Arial" font-size="10" fill="#e2e8f0">Saturn w remoncie torów</text>
    <text x="24" y="262" font-family="Arial" font-size="9" fill="#fde9a6">AURA</text>
    <text x="24" y="278" font-family="Arial" font-size="10" fill="#cbd5e1">Dzwonek i brzęk szyn wyznaczają</text>
    <text x="24" y="292" font-family="Arial" font-size="10" fill="#cbd5e1">niezmienny rytuał miejskiej podróży.</text>
    <rect x="24" y="304" width="232" height="44" rx="8" fill="#2a1d08"/>
    <text x="34" y="320" font-family="Arial" font-size="9" fill="#fbbf24">⚠ PRZESTROGA</text>
    <text x="34" y="336" font-family="Arial" font-size="10" fill="#fef3c7">Zablokowana zwrotnica zatrzyma plan.</text>
    <text x="24" y="366" font-family="Arial" font-size="9" fill="#a5b4fc">KOMPATYBILNOŚĆ KOSMICZNA</text>
    <text x="24" y="382" font-family="Arial" font-size="10" fill="#94a3b8">Harmonia z wydzielonym torowiskiem.</text>
  </g>

  <g transform="translate(460,210)" opacity="0.92">
    <rect width="280" height="430" rx="16" fill="url(#card)" stroke="#e6c374" stroke-width="2"/>
    <rect x="14" y="14" width="252" height="402" rx="12" fill="#0a0d16" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="24" y="38" font-family="monospace" font-size="10" fill="#e6c374">✦ ARCANA II</text>
    <circle cx="140" cy="36" r="13" fill="#1a1a10" stroke="#e6c374"/><text x="140" y="40" font-family="Georgia,serif" font-size="12" fill="#fde9a6" text-anchor="middle">2</text>
    <rect x="24" y="54" width="232" height="120" rx="10" fill="#141a2a" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="140" y="110" font-family="Georgia,serif" font-size="18" fill="#fef3c7" text-anchor="middle">ROWER</text>
    <text x="140" y="132" font-family="Georgia,serif" font-size="11" fill="#e6c374" text-anchor="middle" font-style="italic">Rycerz Okrutnego Łańcucha</text>
    <rect x="24" y="182" width="232" height="58" rx="8" fill="#101624" stroke="#e6c374" stroke-opacity="0.2"/>
    <text x="34" y="204" font-family="Arial" font-size="9" fill="#e6c374">ŻYWIOŁ / PATRON</text>
    <text x="34" y="222" font-family="Arial" font-size="10" fill="#e2e8f0">Smar i Pot · Mars na oponach</text>
    <text x="24" y="262" font-family="Arial" font-size="9" fill="#fde9a6">AURA</text>
    <text x="24" y="278" font-family="Arial" font-size="10" fill="#cbd5e1">Pedały mielą kilometry w modlitwie</text>
    <text x="24" y="292" font-family="Arial" font-size="10" fill="#cbd5e1">o płynny, wietrzny przejazd.</text>
    <rect x="24" y="304" width="232" height="44" rx="8" fill="#2a1d08"/>
    <text x="34" y="320" font-family="Arial" font-size="9" fill="#fbbf24">⚠ PRZESTROGA</text>
    <text x="34" y="336" font-family="Arial" font-size="10" fill="#fef3c7">Szyny i drzwi aut czyhają w ruchu.</text>
  </g>

  <g transform="translate(800,210)" opacity="0.84">
    <rect width="280" height="430" rx="16" fill="url(#card)" stroke="#e6c374" stroke-width="2"/>
    <rect x="14" y="14" width="252" height="402" rx="12" fill="#0a0d16" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="24" y="38" font-family="monospace" font-size="10" fill="#e6c374">✦ ARCANA III</text>
    <circle cx="140" cy="36" r="13" fill="#1a1a10" stroke="#e6c374"/><text x="140" y="40" font-family="Georgia,serif" font-size="12" fill="#fde9a6" text-anchor="middle">3</text>
    <rect x="24" y="54" width="232" height="120" rx="10" fill="#141a2a" stroke="#e6c374" stroke-opacity="0.3"/>
    <text x="140" y="110" font-family="Georgia,serif" font-size="18" fill="#fef3c7" text-anchor="middle">PIESZO</text>
    <text x="140" y="132" font-family="Georgia,serif" font-size="11" fill="#e6c374" text-anchor="middle" font-style="italic">Pielgrzym Chodnikowego Labiryntu</text>
    <rect x="24" y="182" width="232" height="58" rx="8" fill="#101624" stroke="#e6c374" stroke-opacity="0.2"/>
    <text x="34" y="204" font-family="Arial" font-size="9" fill="#e6c374">ŻYWIOŁ / PATRON</text>
    <text x="34" y="222" font-family="Arial" font-size="10" fill="#e2e8f0">Kurz z Krawężnika · Saturn</text>
    <text x="24" y="262" font-family="Arial" font-size="9" fill="#fde9a6">AURA</text>
    <text x="24" y="278" font-family="Arial" font-size="10" fill="#cbd5e1">Buty czytają pęknięcia asfaltu jak</text>
    <text x="24" y="292" font-family="Arial" font-size="10" fill="#cbd5e1">linie papilarne miasta.</text>
    <rect x="24" y="304" width="232" height="44" rx="8" fill="#2a1d08"/>
    <text x="34" y="320" font-family="Arial" font-size="9" fill="#fbbf24">⚠ PRZESTROGA</text>
    <text x="34" y="336" font-family="Arial" font-size="10" fill="#fef3c7">Kałuże i rowery spoza zakrętu.</text>
  </g>
</svg>
